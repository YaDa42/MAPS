

workflows:
  themapps-ios:
    name: THE_MAPPS iOS Build
    instance_type: mac_mini_m2

    environment:
      xcode: latest
      vars:
        APP_NAME: THE_MAPPS
        XCODE_PROJECT: iosApp/THE_MAPPS_iOS.xcodeproj
        XCODE_SCHEME: THE_MAPPS_iOS
        ARCHIVE_URL: "https://github.com/YaDa42/MAPS/releases/download/%601/THE_MAPPS_starter.zip"

    scripts:
      - name: Install dependencies
        script: |
          set -e

          echo "Removing outdated Homebrew tap..."
          brew untap homebrew/autoupdate || true

          echo "Updating Homebrew..."
          brew update

          echo "Installing XcodeGen..."
          brew install xcodegen

          python3 --version
          xcodebuild -version
          xcodegen --version

      - name: Download and extract project
        script: |
          set -e

          cd "$CM_BUILD_DIR"

          echo "Downloading THE_MAPPS starter archive..."
          curl -fL "$ARCHIVE_URL" -o outer.zip

          mkdir -p extracted_outer
          unzip -q outer.zip -d extracted_outer

          echo "Searching for nested Maps.zip..."

          python3 <<'PY'
          import os
          import zipfile

          base = os.path.join(os.environ["CM_BUILD_DIR"], "extracted_outer")
          output = os.path.join(os.environ["CM_BUILD_DIR"], "extracted_inner")

          os.makedirs(output, exist_ok=True)

          archives = []

          for root, dirs, files in os.walk(base):
              for name in files:
                  if name.lower() == "maps.zip":
                      archives.append(os.path.join(root, name))

          if not archives:
              raise SystemExit("ERROR: Maps.zip was not found")

          archive = archives[0]
          print("Found:", archive)

          with zipfile.ZipFile(archive, "r") as z:
              for item in z.infolist():
                  if " Ử" in item.filename:
                      print("Skipping:", item.filename)
                      continue

                  z.extract(item, output)

          print("Nested archive extracted.")
          PY

          echo "Locating Gradle project..."

          PROJECT_ROOT=""

          while IFS= read -r file; do
            PROJECT_ROOT="$(dirname "$file")"
            break
          done < <(find "$CM_BUILD_DIR/extracted_inner" -name settings.gradle.kts -type f)

          if [ -z "$PROJECT_ROOT" ]; then
            echo "ERROR: settings.gradle.kts not found"
            exit 1
          fi

          echo "Project root: $PROJECT_ROOT"
          echo "$PROJECT_ROOT" > "$CM_BUILD_DIR/project_root.txt"

      - name: Build Kotlin iOS framework
        script: |
          set -e

          PROJECT_ROOT="$(cat "$CM_BUILD_DIR/project_root.txt")"
          cd "$PROJECT_ROOT"

          chmod +x ./gradlew

          ./gradlew \
            :composeApp:linkReleaseFrameworkIosArm64 \
            --no-daemon \
            --stacktrace

          FRAMEWORK_PATH="$PROJECT_ROOT/composeApp/build/bin/iosArm64/releaseFramework/THE_MAPPS.framework"

          if [ ! -d "$FRAMEWORK_PATH" ]; then
            echo "ERROR: THE_MAPPS.framework not found"
            find "$PROJECT_ROOT/composeApp/build" -name "*.framework" -type d
            exit 1
          fi

          echo "Framework successfully built:"
          ls -la "$FRAMEWORK_PATH"

          echo "$FRAMEWORK_PATH" > "$CM_BUILD_DIR/framework_path.txt"

      - name: Generate iOS application project
        script: |
          set -e

          PROJECT_ROOT="$(cat "$CM_BUILD_DIR/project_root.txt")"
          FRAMEWORK_PATH="$(cat "$CM_BUILD_DIR/framework_path.txt")"

          cd "$PROJECT_ROOT"
          mkdir -p iosApp

          cat > iosApp/ContentView.swift <<'SWIFT'
          import SwiftUI
          import UIKit
          import THE_MAPPS

          struct ContentView: UIViewControllerRepresentable {
              func makeUIViewController(context: Context) -> UIViewController {
                  MainViewControllerKt.MainViewController()
              }

              func updateUIViewController(
                  _ uiViewController: UIViewController,
                  context: Context
              ) {
              }
          }

          @main
          struct THE_MAPPS_iOSApp: App {
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                  }
              }
          }
          SWIFT

          cat > iosApp/project.yml <<YAML
          name: THE_MAPPS_iOS

          options:
            bundleIdPrefix: com.themapps.ios
            deploymentTarget:
              iOS: "15.0"

          settings:
            base:
              SWIFT_VERSION: "5.0"
              IPHONEOS_DEPLOYMENT_TARGET: "15.0"

          targets:
            THE_MAPPS_iOS:
              type: application
              platform: iOS

              sources:
                - path: ContentView.swift

              dependencies:
                - framework: $FRAMEWORK_PATH
                  embed: true

              settings:
                base:
                  PRODUCT_NAME: THE_MAPPS
                  PRODUCT_MODULE_NAME: THE_MAPPS_iOS
                  PRODUCT_BUNDLE_IDENTIFIER: com.themapps.ios
                  GENERATE_INFOPLIST_FILE: YES
                  INFOPLIST_KEY_CFBundleDisplayName: THE_MAPPS
                  INFOPLIST_KEY_CADisableMinimumFrameDurationOnPhone: YES
                  TARGETED_DEVICE_FAMILY: "1,2"
                  SUPPORTS_MACCATALYST: NO
                  CODE_SIGNING_ALLOWED: NO
                  CODE_SIGNING_REQUIRED: NO
                  CODE_SIGN_IDENTITY: ""
          YAML

          cd iosApp

          echo "Generating Xcode project..."
          xcodegen generate

          echo "Generated Xcode project:"
          ls -la THE_MAPPS_iOS.xcodeproj

      - name: Build iOS application
        script: |
          set -e

          PROJECT_ROOT="$(cat "$CM_BUILD_DIR/project_root.txt")"
          cd "$PROJECT_ROOT"

          xcodebuild \
            -project iosApp/THE_MAPPS_iOS.xcodeproj \
            -scheme THE_MAPPS_iOS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$CM_BUILD_DIR/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Fix and verify Compose Info.plist
        script: |
          set -e

          APP_PATH="$CM_BUILD_DIR/build/Build/Products/Release-iphoneos/THE_MAPPS.app"
          PLIST="$APP_PATH/Info.plist"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: THE_MAPPS.app not found"
            find "$CM_BUILD_DIR/build" -name "*.app" -type d
            exit 1
          fi

          if [ ! -f "$PLIST" ]; then
            echo "ERROR: Info.plist not found"
            exit 1
          fi

          echo "Setting Compose compatibility key..."

          if /usr/libexec/PlistBuddy \
            -c "Print :CADisableMinimumFrameDurationOnPhone" \
            "$PLIST" >/dev/null 2>&1; then

            /usr/libexec/PlistBuddy \
              -c "Set :CADisableMinimumFrameDurationOnPhone true" \
              "$PLIST"
          else
            /usr/libexec/PlistBuddy \
              -c "Add :CADisableMinimumFrameDurationOnPhone bool true" \
              "$PLIST"
          fi

          echo "=== VERIFY COMPOSE IOS PLIST KEY ==="

          /usr/libexec/PlistBuddy \
            -c "Print :CADisableMinimumFrameDurationOnPhone" \
            "$PLIST"

          plutil -lint "$PLIST"

          echo "Info.plist successfully verified."

      - name: Package unsigned IPA
        script: |
          set -e

          APP_PATH="$CM_BUILD_DIR/build/Build/Products/Release-iphoneos/THE_MAPPS.app"
          IPA_PATH="$CM_BUILD_DIR/THE_MAPPS_unsigned.ipa"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Application bundle not found"
            exit 1
          fi

          mkdir -p "$CM_BUILD_DIR/ipa/Payload"
          cp -R "$APP_PATH" "$CM_BUILD_DIR/ipa/Payload/"

          cd "$CM_BUILD_DIR/ipa"
          zip -qry "$IPA_PATH" Payload

          echo "IPA created:"
          ls -lh "$IPA_PATH"

          echo "=== IPA CONTENTS ==="
          unzip -l "$IPA_PATH"

          echo "=== VERIFY KEY INSIDE IPA ==="

          mkdir -p "$CM_BUILD_DIR/ipa_verify"
          unzip -q "$IPA_PATH" -d "$CM_BUILD_DIR/ipa_verify"

          /usr/libexec/PlistBuddy \
            -c "Print :CADisableMinimumFrameDurationOnPhone" \
            "$CM_BUILD_DIR/ipa_verify/Payload/THE_MAPPS.app/Info.plist"

          plutil -lint \
            "$CM_BUILD_DIR/ipa_verify/Payload/THE_MAPPS.app/Info.plist"

          echo "IPA verification completed."

    artifacts:
      - THE_MAPPS_unsigned.ipa
      - build/Build/Products/Release-iphoneos/THE_MAPPS.app
      - "**/*.xcresult"
      - "**/THE_MAPPS.framework"
