
workflows:
  themapps-ios:
    name: THE_MAPPS iOS
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      vars:
        APP_NAME: THE_MAPPS
        BUNDLE_ID: com.themapps.ios
        RELEASE_URL: "https://github.com/YaDa42/MAPS/releases/download/lastest"
      xcode: latest

    scripts:
      - name: Download project archive
        script: |
          set -e
          cd "$CM_BUILD_DIR"

          curl -L --fail --show-error \
            "$RELEASE_URL" \
            -o THE_MAPPS_starter.zip

          ls -lh THE_MAPPS_starter.zip

      - name: Extract project archives
        script: |
          set -e
          cd "$CM_BUILD_DIR"

          mkdir -p extracted_outer extracted_project

          python3 - <<'PY'
          import zipfile
          from pathlib import Path

          archive = Path("THE_MAPPS_starter.zip")
          outer = Path("extracted_outer")
          destination = Path("extracted_project")

          with zipfile.ZipFile(archive) as z:
              for item in z.infolist():
                  parts = Path(item.filename).parts

                  if any(" Ử" in part for part in parts):
                      print("Skipping invalid path:", item.filename)
                      continue

                  if not item.filename:
                      continue

                  target = outer.joinpath(*parts)

                  if item.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with z.open(item) as source, open(target, "wb") as output:
                          output.write(source.read())

          maps_archives = list(outer.rglob("Maps.zip"))

          if not maps_archives:
              raise SystemExit("Maps.zip was not found in the downloaded archive")

          maps_archive = maps_archives[0]
          print("Found:", maps_archive)

          with zipfile.ZipFile(maps_archive) as z:
              for item in z.infolist():
                  parts = Path(item.filename).parts

                  if any(" Ử" in part for part in parts):
                      print("Skipping invalid path:", item.filename)
                      continue

                  if not item.filename:
                      continue

                  target = destination.joinpath(*parts)

                  if item.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with z.open(item) as source, open(target, "wb") as output:
                          output.write(source.read())

          print("Project archives extracted successfully")
          PY

      - name: Locate Gradle project
        script: |
          set -e
          cd "$CM_BUILD_DIR"

          SETTINGS_FILE="$(find extracted_project -name settings.gradle.kts -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "settings.gradle.kts was not found"
            exit 1
          fi

          PROJECT_DIR="$(cd "$(dirname "$SETTINGS_FILE")" && pwd)"

          echo "THE_MAPPS_PROJECT_DIR=$PROJECT_DIR" >> "$CM_ENV"
          echo "Project directory: $PROJECT_DIR"

          ls -la "$PROJECT_DIR"

      - name: Prepare Kotlin iOS bridge
        script: |
          set -e
          cd "$THE_MAPPS_PROJECT_DIR"

          BRIDGE_DIR="composeApp/src/iosMain/kotlin/com/themapps"
          mkdir -p "$BRIDGE_DIR"

          cat > "$BRIDGE_DIR/MainViewController.kt" <<'KOTLIN'
          package com.themapps

          import androidx.compose.ui.window.ComposeUIViewController
          import platform.UIKit.UIViewController

          fun MainViewController(): UIViewController {
              return ComposeUIViewController {
                  App()
              }
          }
          KOTLIN

          echo "Kotlin iOS bridge prepared"
          cat "$BRIDGE_DIR/MainViewController.kt"

      - name: Build Kotlin Native framework
        script: |
          set -e
          cd "$THE_MAPPS_PROJECT_DIR"

          chmod +x ./gradlew

          ./gradlew :composeApp:linkReleaseFrameworkIosArm64 \
            --no-daemon \
            --stacktrace

          FRAMEWORK="$THE_MAPPS_PROJECT_DIR/composeApp/build/bin/iosArm64/releaseFramework/THE_MAPPS.framework"

          if [ ! -d "$FRAMEWORK" ]; then
            echo "THE_MAPPS.framework was not created"
            exit 1
          fi

          echo "Framework successfully built"
          find "$FRAMEWORK/Headers" -maxdepth 2 -type f -print

          echo "FRAMEWORK_PATH=$FRAMEWORK" >> "$CM_ENV"

      - name: Check framework headers
        script: |
          set -e

          echo "Framework headers:"
          find "$FRAMEWORK_PATH/Headers" -maxdepth 2 -type f -print

          echo "MainViewController references:"
          grep -R -n "MainViewController" "$FRAMEWORK_PATH/Headers" || true

      - name: Install XcodeGen
        script: |
          set -e

          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

          xcodegen --version

      - name: Generate iOS Xcode project
        script: |
          set -e
          cd "$THE_MAPPS_PROJECT_DIR"

          mkdir -p iosApp

          cat > iosApp/THE_MAPPSApp.swift <<'SWIFT'
          import SwiftUI

          @main
          struct THE_MAPPSApp: App {
              var body: some Scene {
                  WindowGroup {
                      ContentView().ignoresSafeArea()
                  }
              }
          }
          SWIFT

          cat > iosApp/ContentView.swift <<'SWIFT'
          import SwiftUI
          import THE_MAPPS

          struct ContentView: UIViewControllerRepresentable {
              func makeUIViewController(context: Context) -> UIViewController {
                  MainViewControllerKt.MainViewController()
              }

              func updateUIViewController(
                  _ uiViewController: UIViewController,
                  context: Context
              ) {}
          }
          SWIFT

          cat > iosApp/project.yml <<'YAML'
          name: THE_MAPPS_iOS

          options:
            bundleIdPrefix: com.themapps
            deploymentTarget:
              iOS: "16.0"

          targets:
            THE_MAPPS_iOS:
              type: application
              platform: iOS

              sources:
                - path: THE_MAPPSApp.swift
                - path: ContentView.swift

              dependencies:
                - framework: ../composeApp/build/bin/iosArm64/releaseFramework/THE_MAPPS.framework
                  embed: false

              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.themapps.ios
                  PRODUCT_NAME: THE_MAPPS
                  PRODUCT_MODULE_NAME: THE_MAPPS_iOS
                  SWIFT_VERSION: "5.0"
                  IPHONEOS_DEPLOYMENT_TARGET: "16.0"
                  TARGETED_DEVICE_FAMILY: "1,2"
                  GENERATE_INFOPLIST_FILE: YES
                  INFOPLIST_KEY_CFBundleDisplayName: THE_MAPPS
                  INFOPLIST_KEY_CADisableMinimumFrameDurationOnPhone: YES
                  CODE_SIGNING_ALLOWED: NO
                  CODE_SIGNING_REQUIRED: NO
                  CODE_SIGN_IDENTITY: ""
          YAML

          cd iosApp
          xcodegen generate

          echo "Xcode project generated"
          ls -la

      - name: Build unsigned iOS application
        script: |
          set -e
          cd "$THE_MAPPS_PROJECT_DIR/iosApp"

          xcodebuild \
            -project THE_MAPPS_iOS.xcodeproj \
            -scheme THE_MAPPS_iOS \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$CM_BUILD_DIR/ios_derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

          APP_PATH="$CM_BUILD_DIR/ios_derived/Build/Products/Release-iphoneos/THE_MAPPS.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "THE_MAPPS.app was not created"
            exit 1
          fi

          echo "APP_PATH=$APP_PATH" >> "$CM_ENV"

          echo "Application built successfully"
          ls -la "$APP_PATH"

      - name: Package unsigned IPA
        script: |
          set -e
          cd "$CM_BUILD_DIR"

          mkdir -p ipa_payload/Payload
          cp -R "$APP_PATH" ipa_payload/Payload/THE_MAPPS.app

          cd ipa_payload
          zip -r "$CM_BUILD_DIR/THE_MAPPS_unsigned.ipa" Payload

          cd "$CM_BUILD_DIR"

          ditto -c -k --sequesterRsrc --keepParent \
            "$APP_PATH" \
            THE_MAPPS.app.zip

          ditto -c -k --sequesterRsrc --keepParent \
            "$FRAMEWORK_PATH" \
            THE_MAPPS.framework.zip

          echo "Unsigned IPA created"
          ls -lh THE_MAPPS_unsigned.ipa THE_MAPPS.app.zip THE_MAPPS.framework.zip

    artifacts:
      - THE_MAPPS_unsigned.ipa
      - THE_MAPPS.app.zip
      - THE_MAPPS.framework.zip
      - ios_derived/Build/Products/Release-iphoneos/THE_MAPPS.app
      - composeApp/build/bin/iosArm64/releaseFramework/THE_MAPPS.framework
