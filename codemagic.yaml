
workflows:
  themapps-ios:
    name: THE_MAPPS iOS Framework
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      xcode: latest
      java: 21

    scripts:
      - name: Extract THE_MAPPS starter
        script: |
          set -e

          ARCHIVE="$CM_BUILD_DIR/THE_MAPPS_starter.zip"

          if [ ! -f "$ARCHIVE" ]; then
            echo "ERROR: THE_MAPPS_starter.zip not found"
            exit 1
          fi

          mkdir -p "$CM_BUILD_DIR/project"
          unzip -q "$ARCHIVE" -d "$CM_BUILD_DIR/project"

          echo "Archive extracted successfully."

      - name: Locate Gradle project
        script: |
          set -e

          PROJECT_DIR="$CM_BUILD_DIR/project"

          SETTINGS=$(find "$PROJECT_DIR" \
            -name settings.gradle.kts \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle.kts not found"
            find "$PROJECT_DIR" -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$SETTINGS")

          echo "Project root: $PROJECT_ROOT"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$CM_ENV"

      - name: Generate Gradle Wrapper
        script: |
          set -e

          cd "$PROJECT_ROOT"

          GRADLE_BIN=$(command -v gradle || true)

          if [ -z "$GRADLE_BIN" ]; then
            echo "ERROR: System Gradle not found."
            exit 1
          fi

          echo "===== SYSTEM GRADLE ====="
          "$GRADLE_BIN" --version

          TEMP_WRAPPER="$CM_BUILD_DIR/gradle-wrapper-temp"

          mkdir -p "$TEMP_WRAPPER"

          cat > "$TEMP_WRAPPER/settings.gradle" <<'EOF'
          rootProject.name = "gradle-wrapper-temp"
          EOF

          cat > "$TEMP_WRAPPER/build.gradle" <<'EOF'
          // Temporary project used only to generate Gradle Wrapper.
          EOF

          "$GRADLE_BIN" -p "$TEMP_WRAPPER" wrapper \
            --gradle-version 9.6.0 \
            --no-daemon

          cp "$TEMP_WRAPPER/gradlew" "$PROJECT_ROOT/gradlew"
          cp "$TEMP_WRAPPER/gradlew.bat" "$PROJECT_ROOT/gradlew.bat"

          mkdir -p "$PROJECT_ROOT/gradle/wrapper"

          cp "$TEMP_WRAPPER/gradle/wrapper/"* \
            "$PROJECT_ROOT/gradle/wrapper/"

          chmod +x "$PROJECT_ROOT/gradlew"

          echo "===== GENERATED WRAPPER ====="
          ls -la "$PROJECT_ROOT/gradle/wrapper"

      - name: Check iOS target
        script: |
          set -e

          cd "$PROJECT_ROOT"

          echo "===== GRADLE VERSION ====="
          ./gradlew --version

          echo "===== IOS TASKS ====="
          ./gradlew :composeApp:tasks --all \
            --no-daemon | grep -Ei 'ios|framework|link' || true

      - name: Build THE_MAPPS iOS framework
        script: |
          set -e

          cd "$PROJECT_ROOT"

          ./gradlew :composeApp:linkReleaseFrameworkIosArm64 \
            --no-daemon \
            --stacktrace

          echo "===== FRAMEWORK OUTPUT ====="

          find composeApp/build \
            -name "THE_MAPPS.framework" \
            -print

      - name: Verify framework
        script: |
          set -e

          cd "$PROJECT_ROOT"

          FRAMEWORK=$(find composeApp/build \
            -name "THE_MAPPS.framework" \
            -type d -print -quit)

          if [ -z "$FRAMEWORK" ]; then
            echo "ERROR: THE_MAPPS.framework was not generated."
            exit 1
          fi

          echo "SUCCESS: $FRAMEWORK"
          ls -la "$FRAMEWORK"

    artifacts:
      - $CM_BUILD_DIR/project/**/THE_MAPPS.framework
      - $CM_BUILD_DIR/project/composeApp/build/outputs/**
