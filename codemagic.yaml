          fi

          mkdir -p iosApp

          cat > iosApp/THE_MAPPSApp.swift <<'SWIFT'
          import SwiftUI

          @main
          struct THE_MAPPSApp: App {
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                          .ignoresSafeArea()
                  }
              }
          }
          SWIFT

          cat > iosApp/ContentView.swift <<'SWIFT'
          import SwiftUI
          import THE_MAPPS

          struct ContentView: UIViewControllerRepresentable {
              func makeUIViewController(context: Context) -> UIViewController {
                  MainViewControllerKt.MainViewController()
              }

              func updateUIViewController(
                  _ uiViewController: UIViewController,
                  context: Context
              ) {}
          }
          SWIFT

          cat > iosApp/project.yml <<'YAML'
          name: THE_MAPPS

          options:
            bundleIdPrefix: com.themapps
            deploymentTarget:
              iOS: "16.0"

          targets:
            THE_MAPPS:
              type: application
              platform: iOS
              sources:
                - path: THE_MAPPSApp.swift
                - path: ContentView.swift
              dependencies:
                - framework: ../composeApp/build/bin/iosArm64/releaseFramework/THE_MAPPS.framework
                  embed: false
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.themapps.ios
                  PRODUCT_NAME: THE_MAPPS
                  SWIFT_VERSION: "5.0"
                  IPHONEOS_DEPLOYMENT_TARGET: "16.0"
                  TARGETED_DEVICE_FAMILY: "1,2"
                  GENERATE_INFOPLIST_FILE: YES
                  INFOPLIST_KEY_CFBundleDisplayName: THE_MAPPS
                  CODE_SIGNING_ALLOWED: NO
                  CODE_SIGNING_REQUIRED: NO
                  CODE_SIGN_IDENTITY: ""
          YAML

          xcodegen generate \
            --spec iosApp/project.yml \
            --project iosApp

          test -d iosApp/THE_MAPPS.xcodeproj
          echo "Xcode project generated with THE_MAPPS.framework dependency."

      - name: Build unsigned iOS app and package IPA
        script: |
          set -euo pipefail
          source "$CM_ENV"
          cd "$PROJECT_ROOT"

          DERIVED_DATA="$CM_BUILD_DIR/DerivedData"

          xcodebuild \
            -project iosApp/THE_MAPPS.xcodeproj \
            -scheme THE_MAPPS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

          APP_PATH="$DERIVED_DATA/Build/Products/Release-iphoneos/THE_MAPPS.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Xcode did not produce THE_MAPPS.app."
            exit 1
          fi

          IPA_ROOT="$CM_BUILD_DIR/ipa_payload"
          rm -rf "$IPA_ROOT"
          mkdir -p "$IPA_ROOT/Payload"
          cp -R "$APP_PATH" "$IPA_ROOT/Payload/THE_MAPPS.app"

          cd "$IPA_ROOT"
          /usr/bin/zip -qry "$CM_BUILD_DIR/THE_MAPPS_unsigned.ipa" Payload

          echo "Unsigned IPA created: $CM_BUILD_DIR/THE_MAPPS_unsigned.ipa"

    artifacts:
      - $CM_BUILD_DIR/THE_MAPPS_unsigned.ipa
      - $CM_BUILD_DIR/DerivedData/Build/Products/Release-iphoneos/THE_MAPPS.app
      - $CM_BUILD_DIR/**/THE_MAPPS.framework
